[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=true
export_filter="all_resources"
include_filter="data/*.json,data/**/*.json"
exclude_filter="tests/*,tools/*,artifacts/*,*.md,.tools/*"
export_path="build/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.tools/templates/web_nothreads_debug.zip"
custom_template/release="res://.tools/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/custom_html_shell=""
html/head_include="<style>:root{--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}body{background:#0d252e;touch-action:none}#canvas{touch-action:none}</style>"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.05,0.14,0.18,1)

